<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotZapp</title>
  <style>
    :root {
      --surface: #492923;
      --surface-light: #654335;
      --panel: #3d211b;
      --text: #f1e7dd;
      --muted: #d8c3b5;
      --accent: #e4d8d2;
      --accent-strong: #f5efe9;
      --border: rgba(228, 216, 210, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(228, 216, 210, 0.45), transparent 24%),
                  linear-gradient(180deg, #e4d8d2 0%, #f5efe9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app-shell {
      width: min(100%, 1120px);
      display: flex;
      gap: 24px;
      align-items: stretch;
    }

    .sidebar,
    .main {
      border-radius: 28px;
      background: rgba(18, 55, 61, 0.96);
      border: 1px solid var(--border);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.25);
      padding: 24px;
    }

    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 0.08em;
      text-transform: none;
      color: var(--accent);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: inline-flex;
      align-items: baseline;
      gap: 0.1em;
    }

    .brand-z {
      display: inline-block;
      font-size: 2.8rem;
      line-height: 0.85;
      font-weight: 800;
      color: #f5efe9;
      animation: color-shift 3.4s ease-in-out infinite;
      text-shadow: 0 0 12px rgba(245, 239, 233, 0.35);
    }

    @keyframes color-shift {
      0%, 100% { color: #f5efe9; }
      20% { color: #f4c26b; }
      40% { color: #d88dea; }
      60% { color: #8ad7ff; }
      80% { color: #75f0b4; }
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 1.2rem;
      color: var(--text);
    }

    p,
    label {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    select,
    textarea,
    button {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 14px 16px;
      font-size: 1rem;
    }

    select {
      width: 100%;
      min-width: 0;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%),
                        linear-gradient(135deg, var(--text) 50%, transparent 50%);
      background-position: calc(100% - 20px) calc(1em + 2px), calc(100% - 15px) calc(1em + 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 40px;
      line-height: 1.5;
    }

    select option {
      white-space: normal;
      padding: 8px 12px;
    }

    .input-row {
      display: flex;
      gap: 0;
      align-items: stretch;
    }

    .input-row textarea {
      flex: 1;
      min-height: 150px;
      width: auto;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: none;
    }

    .send-button {
      width: 84px;
      min-height: 150px;
      border-radius: 0 18px 18px 0;
      padding: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e4d8d2, #f5efe9);
      color: #492923;
      font-size: 1.8rem;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(73, 41, 35, 0.12);
    }

    .send-button span {
      display: inline-block;
      transform: none;
    }

    .send-button.loading {
      animation: pulse-button 1.2s ease-in-out infinite;
      filter: brightness(1.12);
    }

    .send-button.loading span {
      animation: pulse-text 1.2s ease-in-out infinite;
    }

    @keyframes pulse-button {
      0%, 100% {
        background: linear-gradient(135deg, #e4d8d2, #f5efe9);
      }
      50% {
        background: linear-gradient(135deg, #f7eeeb, #fff6f0);
      }
    }

    @keyframes pulse-text {
      0%, 100% {
        color: #492923;
      }
      50% {
        color: #2f150f;
      }
    }

    .message.assistant.thinking::after {
      content: ' ...';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% {
        content: ' ';
      }
      40% {
        content: '.';
      }
      60% {
        content: '..';
      }
      80%, 100% {
        content: '...';
      }
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #492923;
      font-weight: 700;
      border: none;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .sources-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
    }

    .toggle-button {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 14px 16px;
      cursor: pointer;
      font-size: 1rem;
    }

    .model-status-row {
      display: flex;
      justify-content: stretch;
      gap: 12px;
    }

    .offload-button {
      width: 100%;
      border-radius: 18px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #e4d8d2, #f5efe9);
      color: #492923;
      font-weight: 700;
      border: 1px solid rgba(73, 41, 35, 0.15);
      cursor: pointer;
      transition: filter 0.18s ease, transform 0.18s ease;
    }

    .offload-button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .offload-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      filter: none;
    }

    .toggle-button:hover {
      filter: brightness(1.1);
    }

    .info-text {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .index-refresh-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .refresh-button {
      border: none;
      background: transparent;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0;
      transition: filter 0.18s ease;
    }

    .refresh-button:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    .refresh-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .status {
      color: var(--text);
      font-size: 0.95rem;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      padding: 20px;
      border-radius: 20px;
      background: rgba(228, 216, 210, 0.14);
      border: 1px solid rgba(73, 41, 35, 0.20);
      min-height: 150px;
    }

    .chat-window {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 420px;
      max-height: 560px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(37,211,102,0.22);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .message {
      max-width: 95%;
      padding: 18px;
      border-radius: 22px;
      line-height: 1.7;
      font-size: 0.98rem;
      border: 1px solid rgba(255,255,255,0.08);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.assistant {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      align-self: flex-start;
    }

    .message.user {
      background: rgba(37,211,102,0.18);
      color: #041414;
      align-self: flex-end;
      border-color: rgba(37,211,102,0.3);
    }

    .message.placeholder {
      opacity: 0.72;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
    }

    .sources {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .sources li {
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.95rem;
    }

    @media (max-width: 920px) {
      .app-shell {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .input-row {
        flex-direction: column;
      }

      .send-button {
        width: 100%;
        min-width: auto;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .main,
      .sidebar {
        padding: 18px;
      }

      .chat-window {
        min-height: 360px;
        max-height: 520px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <h1>Bot<span class="brand-z">Z</span>app</h1>
      </div>
      <div class="panel">
        <div>
          <label for="chatModel">Select model</label>
          <select id="chatModel">
            <option value="qwen2.5-coder:1.5b">qwen2.5-coder:1.5b</option>
            <option value="llama3:latest">llama3:latest</option>
            <option value="llama3.1:8b">llama3.1:8b</option>
            <option value="Mistral:7b">Mistral:7b</option>
            <option value="deepseek-r1:latest">deepseek-r1:latest</option>
            <option value="hhao/qwen2.5-coder-tools:7b">hhao/qwen2.5-coder-tools:7b</option>
            <option value="phi3:mini">phi3:mini</option>
            <option value="starcoder2:3b">starcoder2:3b</option>
            <option value="qwen2.5-coder:7b-instruct-q4_K_M">qwen2.5-coder:7b-instruct-q4_K_M</option>
          </select>
        </div>
        <div class="model-status-row">
          <button id="offloadButton" class="offload-button" type="button">Status unknown</button>
        </div>
        <div>
          <label>Embedding model</label>
          <p><strong id="embeddingModelText">nomic-embed-text:latest</strong></p>
          <p id="embeddingRefresh" class="info-text">Not indexed yet</p>
          <div class="index-refresh-section">
            <span class="info-text">Refresh index from vault</span>
            <button id="refreshIndexButton" class="refresh-button" type="button">Refresh</button>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="panel">
        <div class="input-row">
        <textarea id="query" rows="5" placeholder="Ask anything about your notes..."></textarea>
        <button id="submit" class="send-button" aria-label="Send"><span>⏎</span></button>
      </div>
      <section class="card chat-window">
        <div id="messages" class="messages"></div>
      </section>
      <section class="card">
        <div class="sources-header">
          <button id="toggleSources" class="toggle-button" type="button">Sources</button>
        </div>
        <ul id="sources" class="sources hidden"></ul>
      </section>
    </main>
  </div>

  <script>
    const apiBase = "http://localhost:8000";
    const submit = document.getElementById("submit");
    const queryEl = document.getElementById("query");
    const chatModelEl = document.getElementById("chatModel");
    const offloadButton = document.getElementById("offloadButton");
    const refreshIndexButton = document.getElementById("refreshIndexButton");
    const embeddingRefreshEl = document.getElementById("embeddingRefresh");
    const messagesEl = document.getElementById("messages");
    const sourcesEl = document.getElementById("sources");

    let currentModelLoaded = false;

    const savedChatModel = localStorage.getItem("botzappChatModel");
    if (savedChatModel && [...chatModelEl.options].some(opt => opt.value === savedChatModel)) {
      chatModelEl.value = savedChatModel;
    }

    const setOffloadState = (state, loaded) => {
      offloadButton.textContent = state;
      offloadButton.disabled = !loaded;
      currentModelLoaded = loaded;
    };

    const updateModelStatus = async (model) => {
      setOffloadState("Checking status...", false);
      try {
        const response = await fetch(`${apiBase}/model/status?model=${encodeURIComponent(model)}`);
        const data = await response.json();
        if (response.ok) {
          if (data.loaded) {
            setOffloadState("Loaded — Offload", true);
          } else {
            setOffloadState("Not loaded", false);
          }
        } else {
          setOffloadState("Status unavailable", false);
        }
      } catch (error) {
        setOffloadState("Status unavailable", false);
      }
    };

    chatModelEl.addEventListener("change", () => {
      localStorage.setItem("botzappChatModel", chatModelEl.value);
      updateModelStatus(chatModelEl.value);
    });

    const formatRefreshTime = (value) => {
      if (!value) {
        return "Not indexed yet";
      }
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }
      return `Last refreshed ${date.toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" })}`;
    };

    const loadAppConfig = async () => {
      try {
        const response = await fetch(`${apiBase}/config`);
        const data = await response.json();
        document.getElementById("embeddingModelText").textContent = data.embedding_model || "nomic-embed-text:latest";
        embeddingRefreshEl.textContent = formatRefreshTime(data.last_refreshed);
      } catch (error) {
        embeddingRefreshEl.textContent = "Unable to load refresh time";
      }
    };

    const refreshIndex = async () => {
      refreshIndexButton.disabled = true;
      refreshIndexButton.textContent = "Refreshing...";
      try {
        const response = await fetch(`${apiBase}/index`, { method: "POST" });
        const data = await response.json();
        if (response.ok) {
          embeddingRefreshEl.textContent = formatRefreshTime(data.last_refreshed);
          refreshIndexButton.textContent = "Refreshed";
        } else {
          refreshIndexButton.textContent = "Refresh failed";
        }
      } catch (error) {
        refreshIndexButton.textContent = "Refresh failed";
      } finally {
        setTimeout(() => {
          refreshIndexButton.textContent = "Refresh";
          refreshIndexButton.disabled = false;
          loadAppConfig();
        }, 1400);
      }
    };

    const addMessage = (text, role) => {
      const message = document.createElement("div");
      message.className = `message ${role}`;
      message.textContent = text;
      messagesEl.appendChild(message);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };

    const clearPlaceholder = () => {
      const placeholder = messagesEl.querySelector(".placeholder");
      if (placeholder) placeholder.remove();
    };

    const sendQuery = async () => {
      const query = queryEl.value.trim();
      if (!query) return;
      queryEl.value = "";
      clearPlaceholder();
      addMessage(query, "user");
      addMessage("Thinking", "assistant");
      const assistantMessages = messagesEl.querySelectorAll(".message.assistant");
      const lastAssistant = assistantMessages[assistantMessages.length - 1];
      if (lastAssistant) {
        lastAssistant.classList.add("thinking");
      }
      submit.classList.add("loading");
      submit.disabled = true;
      queryEl.disabled = true;
      sourcesEl.innerHTML = "";

      try {
        const response = await fetch(`${apiBase}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            chat_model: chatModelEl.value,
          }),
        });

        const data = await response.json();
        if (lastAssistant) {
          lastAssistant.classList.remove("thinking");
          lastAssistant.textContent = data.answer || data.detail || "No answer";
        }

        if (data.sources) {
          data.sources.forEach(source => {
            const li = document.createElement("li");
            li.textContent = source.path;
            sourcesEl.appendChild(li);
          });
        }
      } catch (error) {
        if (lastAssistant) {
          lastAssistant.classList.remove("thinking");
          lastAssistant.textContent = "Request failed. Check the backend and try again.";
        }
      } finally {
        submit.classList.remove("loading");
        submit.disabled = false;
        queryEl.disabled = false;
        queryEl.focus();
        updateModelStatus(chatModelEl.value);
      }
    };

    submit.addEventListener("click", sendQuery);
    queryEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuery();
      }
    });

    offloadButton.addEventListener("click", async () => {
      if (!currentModelLoaded) return;
      offloadButton.disabled = true;
      offloadButton.textContent = "Offloading...";
      try {
        const response = await fetch(`${apiBase}/model/offload`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: chatModelEl.value }),
        });
        const data = await response.json();
        if (response.ok && data.offloaded) {
          setOffloadState("Offloaded", false);
        } else if (response.ok && data.status === "not_loaded") {
          setOffloadState("Not loaded", false);
        } else {
          setOffloadState("Offload failed", false);
        }
      } catch (error) {
        setOffloadState("Offload failed", false);
      }
    });

    updateModelStatus(chatModelEl.value);
    loadAppConfig();

    refreshIndexButton.addEventListener("click", refreshIndex);

    const toggleSources = document.getElementById("toggleSources");
    const sourcesList = document.getElementById("sources");
    toggleSources.addEventListener("click", () => {
      sourcesList.classList.toggle("hidden");
      toggleSources.textContent = sourcesList.classList.contains("hidden") ? "Sources" : "Hide Sources";
    });
  </script>
</body>
</html>
